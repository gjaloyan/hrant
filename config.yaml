# ════════════════════════════════════════════════════════════════════
# SELF-LEARNING AGENT — конфигурация
#
# Главная настройка — режим работы (mode). Выбор режима автоматически
# применяет sensible defaults для всех подсистем. Ниже можно переопределить
# любой конкретный ключ.
#
# Доступные режимы:
#
#   1. local_full     — у тебя есть GPU ≥12GB VRAM.
#                       Qwen 7B запускается локально через Ollama,
#                       fine-tune идёт локально через Unsloth LoRA.
#
#   2. cloud_finetune — GPU нет или слабый, но есть Ollama для inference.
#                       Сбор Q&A локально → export-cloud → запуск на
#                       арендованной GPU (RunPod/Vast.ai/Colab Pro) →
#                       import-gguf обратно → Ollama регистрирует.
#
#   3. local_cpu      — нет GPU, только CPU. Используется маленькая Qwen 1.5B
#                       (помещается в RAM). Тренировка экспериментальна
#                       и очень медленна — рекомендую cloud_finetune.
#
#   4. claude_only    — нет никакой локальной модели. Всё reasoning через
#                       Claude API. Заметки и finetune_queue собираются
#                       локально (можно переключиться позже на другой mode).
# ════════════════════════════════════════════════════════════════════

mode: "claude_only"

# ─── Явные переопределения (опционально) ───
# Если нужно изменить конкретный ключ пресета — раскомментируй и поправь.
#
# model_a:
#   model: "claude-sonnet-4-5"        # или claude-opus-4-6 для сложных задач
#
# model_b:
#   model: "qwen2.5:14b-instruct"     # если VRAM хватает на 14B
#
# router:
#   daily_api_budget_usd: 10.0        # увеличить дневной лимит
#   fallback_to_local: false          # отключить fallback на Qwen
#
# verification:
#   min_confidence: 80                # более строгий порог
#
# finetune:
#   confidence_threshold: 90          # собирать только высочайшее качество
