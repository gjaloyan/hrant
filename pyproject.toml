[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-agent"
version = "0.1.0"
description = "Self-learning local AI agent (Claude + Qwen dual-router, claims/evidence verifier, autonomic levers)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gor Jaloyan" }]
license = { text = "MIT" }
keywords = ["ai", "agent", "llm", "self-learning", "anthropic", "claude", "local-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.39.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "rapidfuzz>=3.6.0",
    "sse-starlette>=2.0.0",
    "mcp>=1.0.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
telegram = [
    "python-telegram-bot>=21.0",
]

[project.scripts]
# After `pip install -e .` the `agi` command resolves to
# `backend.cli:main`. Both forms work:
#   agi run         (entry point)
#   python -m backend.cli run
agi = "backend.cli:main"

[project.urls]
Repository = "https://github.com/gjaloyan/AGI"

[tool.setuptools]
# We ship only the backend package; frontend dist is loaded at runtime
# from frontend/dist via FastAPI static-files mount, not bundled into
# the wheel.
packages = ["backend", "backend.api", "backend.pipeline", "backend.tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
