[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-agent"
version = "0.16"  # baseline; runtime appends ".{commit_count}" (see backend/version.py)
description = "Self-learning local AI agent (Claude + Qwen dual-router, claims/evidence verifier, autonomic levers)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gor Jaloyan" }]
license = { text = "MIT" }
keywords = ["ai", "agent", "llm", "self-learning", "anthropic", "claude", "local-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.39.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "rapidfuzz>=3.6.0",
    "sse-starlette>=2.0.0",
    "mcp>=1.0.0",
    "psutil>=5.9",
    # Telegram support is a first-class channel — wizard creates it by
    # default, channels.py auto-starts it on boot. Bundling here means
    # `pip install -e .` is enough; no separate extras invocation.
    "python-telegram-bot>=21.0",
    # Edge TTS — free, online Microsoft TTS used as the default voice
    # backend. ~400 multilingual neural voices, no API key, no local
    # model files. Falls through to Piper / OpenAI when unreachable.
    "edge-tts>=6.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
# After `pip install -e .` the `hrant` command resolves to
# `backend.cli:main`. The agent's own name is Hrant (see
# knowledge/identity/identity.md — "Меня зовут Hrant"); the CLI
# matches. Both invocations work:
#   hrant run        (entry point)
#   python -m backend.cli run
hrant = "backend.cli:main"

[project.urls]
Repository = "https://github.com/gjaloyan/hrant"

[tool.setuptools]
# Audit P1 #4 fix: previously the wheel only shipped four hand-picked
# packages ("backend", "backend.api", "backend.pipeline", "backend.tools")
# and silently omitted the rest (backend.autonomic, backend.graph,
# backend.skills, backend.consolidation, backend.subagents, ...).
# Editable install (`pip install -e .`) masks the gap because `.pth`
# files reach the whole source tree. A real wheel install was broken.
#
# Auto-discover every `backend*` subpackage so new additions land in
# the wheel automatically.

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
# `frontend/` is built separately and served as static files at
# runtime — keep it out of the wheel.
exclude = ["frontend*", "tests*", "docs*", "deploy*"]

[tool.setuptools.package-data]
"backend.skills" = ["**/SKILL.md", "**/handler.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
